# Portfolio editor. Each save is a commit to main; GitHub Actions rebuilds and
# publishes the site about a minute later.
backend:
  name: github
  repo: aniolescofet13/aniolescofet13.github.io
  branch: main

# Images uploaded through the editor, kept apart from the project folders.
media_folder: src/assets/uploads
public_folder: /src/assets/uploads

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    extension: mdx
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  ·  {{visibility}}"
    sortable_fields: [title, category, order, visibility]
    fields:
      # --- what is shown, and where the code lives ---
      - name: visibility
        label: Visibility
        widget: select
        default: listed
        hint: >-
          Unlisted keeps the project off the portfolio but gives it its own
          page, /projects/<name>/, for sending to one person. It stays out of
          search engines. Hidden publishes nothing.
        options:
          - { label: "Listed — on the portfolio", value: listed }
          - { label: "Unlisted — own page only, for a direct link", value: unlisted }
          - { label: "Hidden — not published", value: hidden }
      - name: repo
        label: Repository URL
        widget: string
        required: false
        hint: For example https://github.com/aniolescofet13/lap-time
      - name: repoPublic
        label: Repository is public
        widget: boolean
        default: false
        hint: >-
          Shows a GitHub link on the card. Leave it off for a private repo:
          the link would be a 404 for anyone who follows it.

      # --- the card ---
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Personal, value: personal }
          - { label: Formula Student, value: fs }
          - { label: Professional, value: pro }
          - { label: University, value: uni }
      - name: order
        label: Order within its category
        widget: number
        value_type: int
        min: 1
        hint: >-
          Sort position. The label shown on the card (PP — 01 …) is counted
          from the listed projects only, so hiding one leaves no gap.
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: badge, label: Badge, widget: string, required: false, hint: "e.g. Grade: 10/10" }

      # --- the write-up ---
      # Plain text on purpose: the body is MDX with <Slider>, <Pdf> and <Note>
      # components, and a rich-text editor could reformat them on save.
      - name: body
        label: Body (MDX)
        widget: text
        hint: >-
          Markdown, plus <Slider items={[…]} />, <Pdf src="…" /> and
          <Note>…</Note>. Images are paths under src/assets, e.g.
          "LapTime/P9 - Web Run.png".
