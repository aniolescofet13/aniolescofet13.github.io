# Build the Astro site and publish it to GitHub Pages on every push to main.
# Requires Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a new push waits rather than cancelling a
# deployment that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds with the lockfile and uploads dist/ as the Pages artifact.
      # Astro 7 needs Node 22.12+; 24 matches local development.
      - uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # If the build failed, nothing reaches here and the live site is left as
      # it was.
      - id: deployment
        uses: actions/deploy-pages@v5
